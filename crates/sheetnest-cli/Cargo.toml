[package]
name = "sheetnest-cli"
description = "Command-line nesting for sheet cutting: nest DXF parts, validate layouts, benchmark"
keywords = ["nesting", "dxf", "laser", "cnc", "cli"]
categories = ["command-line-utilities", "algorithms"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sheetnest"
path = "src/main.rs"

[dependencies]
sheetnest = { path = "../sheetnest", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dxf = "0.6"
serde_json = "1"
