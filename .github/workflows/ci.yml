name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    name: No production drawings in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any DXF over 200 KB
        run: |
          big=$(find . -name '*.dxf' -size +200k -not -path './target/*')
          if [ -n "$big" ]; then
            echo "These DXF files are too large to be synthetic fixtures:"; echo "$big"; exit 1
          fi
      - name: Fail on internal references
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=target -E 'cad-app|gs://|fixtures-real' . | grep -v '^./.gitignore' | grep -v '^./.github/workflows/ci.yml'; then
            echo "Internal references found"; exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (core only, no dxf/svg/parallel)
        run: cargo test -p sheetnest --no-default-features
      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

  python:
    name: Python bindings
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: crates/sheetnest-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin pytest
          maturin develop --release
          pytest -q tests

  wasm:
    name: WebAssembly package
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/wasm"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # WASI SDK + wasm-pack + wasm-bindgen are ~300 MB of downloads;
      # scripts/build.sh fetches them into .tmp on a cache miss.
      - uses: actions/cache@v4
        with:
          path: crates/sheetnest-wasm/.tmp
          key: wasm-toolchains-wasi24-wp0.15.0-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build package
        run: crates/sheetnest-wasm/scripts/build.sh
      - name: Test package
        run: node --test tests/node/*.test.mjs
        working-directory: crates/sheetnest-wasm
      - name: Clippy (wasm32)
        working-directory: crates/sheetnest-wasm
        run: |
          SDK="$PWD/.tmp/wasi-sdk-24.0-x86_64-linux"
          export CC_wasm32_unknown_unknown="$SDK/bin/clang" \
                 CXX_wasm32_unknown_unknown="$SDK/bin/clang++" \
                 AR_wasm32_unknown_unknown="$SDK/bin/llvm-ar" \
                 CFLAGS_wasm32_unknown_unknown=--target=wasm32-wasip1 \
                 CXXFLAGS_wasm32_unknown_unknown="--target=wasm32-wasip1 -fno-exceptions -fno-rtti -D_LIBCPP_VERBOSE_ABORT(...)=__builtin_trap()" \
                 CXXSTDLIB_wasm32_unknown_unknown="" \
                 CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/wasm"
          cargo clippy -p sheetnest-wasm --target wasm32-unknown-unknown -- -D warnings

  msrv:
    name: MSRV (1.88)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
