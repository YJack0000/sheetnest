name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    name: No production drawings in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any DXF over 200 KB
        run: |
          big=$(find . -name '*.dxf' -size +200k -not -path './target/*')
          if [ -n "$big" ]; then
            echo "These DXF files are too large to be synthetic fixtures:"; echo "$big"; exit 1
          fi
      - name: Fail on internal references
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=target -E 'cad-app|gs://|fixtures-real' . | grep -v '^./.gitignore' | grep -v '^./.github/workflows/ci.yml'; then
            echo "Internal references found"; exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (core only, no dxf/svg/parallel)
        run: cargo test -p sheetnest --no-default-features
      - name: Docs
        run: cargo doc --workspace --no-deps --all-features

  python:
    name: Python bindings
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: crates/sheetnest-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin pytest
          maturin develop --release
          pytest -q tests

  wasm:
    name: WebAssembly package
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache WASI SDK
        uses: actions/cache@v4
        with:
          path: crates/sheetnest-wasm/.tmp
          key: wasi-sdk-24-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      - name: Build
        run: crates/sheetnest-wasm/scripts/build.sh
      - name: Test
        run: node --test crates/sheetnest-wasm/tests/node

  msrv:
    name: MSRV (1.88)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
